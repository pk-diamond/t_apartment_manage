<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>駐車場予約システム</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

  <div class="max-w-md mx-auto bg-white min-h-screen shadow-md relative">
    
    <!-- ヘッダー -->
    <header class="bg-blue-600 text-white p-4 sticky top-0 z-10 shadow-sm">
      <h1 class="text-lg font-bold text-center tracking-wide">駐車場予約</h1>
    </header>

    <!-- ログインユーザー情報 (初期は非表示) -->
    <div id="user-info" class="p-3 flex items-center space-x-3 border-b hidden bg-blue-50">
      <img id="user-icon" src="" alt="icon" class="w-10 h-10 rounded-full border border-blue-200">
      <div>
        <p class="text-xs text-blue-600 font-semibold">LINE連携済</p>
        <p id="user-name" class="text-sm font-bold text-gray-800"></p>
      </div>
    </div>

    <main class="p-5 pb-20">
      
      <!-- 初回読み込み中の表示 -->
      <div id="initial-loading" class="text-center py-20">
        <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full mb-3"></div>
        <p class="text-sm text-gray-500 font-medium">システムを準備中...</p>
      </div>

      <!-- メインフォームエリア -->
      <div id="form-area" class="hidden space-y-6">
        
        <!-- Step 1: 日付と駐車場の選択 -->
        <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
          <h2 class="font-bold mb-4 flex items-center text-gray-800">
            <span class="bg-blue-100 text-blue-800 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">1</span>
            利用開始日と駐車場を選択
          </h2>
          
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">利用開始日</label>
              <input type="date" id="reserve-date" class="w-full border-gray-300 rounded-lg p-3 border focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            
            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1">駐車場</label>
              <div class="flex space-x-3">
                <label class="flex-1 flex items-center justify-center p-3 border rounded-lg cursor-pointer transition hover:bg-gray-50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-700">
                  <input type="radio" name="parking-no" value="no1" class="w-4 h-4 text-blue-600" checked>
                  <span class="ml-2 font-bold">No.1</span>
                </label>
                <label class="flex-1 flex items-center justify-center p-3 border rounded-lg cursor-pointer transition hover:bg-gray-50 has-[:checked]:bg-blue-50 has-[:checked]:border-blue-500 has-[:checked]:text-blue-700">
                  <input type="radio" name="parking-no" value="no2" class="w-4 h-4 text-blue-600">
                  <span class="ml-2 font-bold">No.2</span>
                </label>
              </div>
            </div>

            <button id="btn-check" class="w-full bg-gray-800 text-white font-bold py-3.5 rounded-lg hover:bg-gray-700 transition shadow-sm">
              空き状況を確認する
            </button>
          </div>
        </div>

        <!-- Step 2: 空き状況の結果と時間入力 (初期は非表示) -->
        <div id="step2-area" class="hidden bg-white p-5 rounded-xl shadow-sm border border-gray-100 transition-all">
          <h2 class="font-bold mb-4 flex items-center text-gray-800">
            <span class="bg-blue-100 text-blue-800 w-6 h-6 rounded-full flex items-center justify-center text-xs mr-2">2</span>
            予約時間を指定 (最長24時間)
          </h2>

          <div class="mb-5">
            <p class="text-sm font-semibold text-gray-700 mb-2">現在の予約済み時間帯 (翌日まで表示)</p>
            <div id="availability-list" class="bg-gray-50 rounded-lg p-3 text-sm text-gray-600 border border-gray-200 min-h-[3rem] max-h-40 overflow-y-auto">
              <!-- GASからのデータが入ります -->
            </div>
          </div>

          <div class="space-y-4">
            <!-- 開始時間 -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
              <label class="block text-xs font-semibold text-gray-500 mb-2">開始時間</label>
              <div class="flex items-center space-x-2">
                <span id="display-start-date" class="text-sm font-bold text-gray-700 w-20 text-center"></span>
                <select id="start-time" class="flex-1 border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500 outline-none bg-white"></select>
              </div>
            </div>

            <!-- 終了時間 -->
            <div class="bg-gray-50 p-3 rounded-lg border border-gray-200">
              <label class="block text-xs font-semibold text-gray-500 mb-2">終了時間</label>
              <div class="flex items-center space-x-2">
                <select id="end-date-type" class="w-24 border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500 outline-none bg-white text-sm font-bold text-gray-700 text-center">
                  <option value="same">同日</option>
                  <option value="next">翌日</option>
                </select>
                <select id="end-time" class="flex-1 border-gray-300 rounded-lg p-2 border focus:ring-2 focus:ring-blue-500 outline-none bg-white"></select>
              </div>
            </div>

            <div>
              <label class="block text-sm font-semibold text-gray-700 mb-1 mt-4">部屋番号</label>
              <input type="text" id="room-number" placeholder="例: 101" class="w-full border-gray-300 rounded-lg p-3 border focus:ring-2 focus:ring-blue-500 outline-none" inputmode="numeric">
            </div>

            <button id="btn-submit" class="w-full bg-blue-600 text-white font-bold py-3.5 rounded-lg hover:bg-blue-700 transition shadow-md flex justify-center items-center mt-4">
              <span>この内容で予約を確定する</span>
            </button>
          </div>
        </div>

      </div>
    </main>

    <!-- モーダル -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-60 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
      <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 text-center transform transition-all">
        <h3 id="modal-title" class="text-lg font-bold mb-3 text-gray-800"></h3>
        <p id="modal-message" class="text-gray-600 mb-6 text-sm whitespace-pre-wrap leading-relaxed text-left"></p>
        <button id="btn-modal-close" class="w-full bg-gray-100 text-gray-800 font-bold py-3 rounded-xl hover:bg-gray-200 transition">閉じる</button>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // 設定
    // ==========================================
    const LIFF_ID = "2009135360-XXFOHmaM";
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyOQQ6-maeEB_IQqeqtup-HaOFSpDfI6Nx4hsf-6XS6GMCp5j7YcnlU0_tbfRc7KUdk/exec";

    let currentUser = { name: "", id: "" };
    let selectedStartDateStr = ""; // ユーザーが選んだ基準日

    // ==========================================
    // 初期化処理
    // ==========================================
    window.onload = function() {
      initLiff();
      setupDateInput();
      generateTimeOptions();
      setupEventListeners();
    };

    function initLiff() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          return liff.getProfile();
        })
        .then((profile) => {
          if (profile) {
            currentUser.name = profile.displayName;
            currentUser.id = profile.userId;
            
            document.getElementById('user-name').textContent = profile.displayName;
            document.getElementById('user-icon').src = profile.pictureUrl || 'https://via.placeholder.com/150';
            
            document.getElementById('initial-loading').classList.add('hidden');
            document.getElementById('user-info').classList.remove('hidden');
            document.getElementById('form-area').classList.remove('hidden');
          }
        })
        .catch((err) => {
          showModal("認証エラー", "LINE連携に失敗しました。\nブラウザを再読み込みしてください。");
          console.error(err);
        });
    }

    function setupDateInput() {
      const dateInput = document.getElementById('reserve-date');
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      const todayStr = `${yyyy}-${mm}-${dd}`;
      
      dateInput.value = todayStr;
      dateInput.min = todayStr;
    }

    function generateTimeOptions() {
      const startSelect = document.getElementById('start-time');
      const endSelect = document.getElementById('end-time');
      
      // 00:00 〜 23:00 までの1時間単位
      for (let i = 0; i < 24; i++) {
        const hour = String(i).padStart(2, '0');
        const timeStr = `${hour}:00`;
        startSelect.add(new Option(timeStr, timeStr));
        endSelect.add(new Option(timeStr, timeStr));
      }
    }

    function setupEventListeners() {
      document.getElementById('btn-check').addEventListener('click', handleCheckAvailability);
      document.getElementById('btn-submit').addEventListener('click', handleSubmitReservation);
      
      document.getElementById('btn-modal-close').addEventListener('click', () => {
        document.getElementById('modal').classList.add('hidden');
      });
      
      document.getElementById('reserve-date').addEventListener('change', hideStep2);
      const radios = document.getElementsByName('parking-no');
      radios.forEach(r => r.addEventListener('change', hideStep2));
    }

    function hideStep2() {
      document.getElementById('step2-area').classList.add('hidden');
    }

    // ==========================================
    // API通信・メインロジック
    // ==========================================

    async function handleCheckAvailability() {
      const dateStr = document.getElementById('reserve-date').value;
      const parkingNo = document.querySelector('input[name="parking-no"]:checked').value;
      
      if (!dateStr) {
        showModal("入力エラー", "利用開始日を選択してください。");
        return;
      }
      
      selectedStartDateStr = dateStr;
      const [y, m, d] = dateStr.split('-');
      document.getElementById('display-start-date').textContent = `${m}/${d}`;
      
      const btn = document.getElementById('btn-check');
      const originalText = btn.textContent;
      btn.textContent = "カレンダーを確認中...";
      btn.disabled = true;
      btn.classList.add('opacity-70');
      
      try {
        const url = `${GAS_API_URL}?action=getAvailability&date=${dateStr}`;
        const res = await fetch(url);
        const json = await res.json();
        
        if (json.status === "error") throw new Error(json.message);
        
        const events = json.data[parkingNo] || [];
        renderAvailability(events);
        
        document.getElementById('step2-area').classList.remove('hidden');
        
      } catch (err) {
        showModal("通信エラー", "空き状況の取得に失敗しました。\n" + err.message);
      } finally {
        btn.textContent = originalText;
        btn.disabled = false;
        btn.classList.remove('opacity-70');
      }
    }

    function renderAvailability(events) {
      const listEl = document.getElementById('availability-list');
      listEl.innerHTML = ''; 
      
      if (events.length === 0) {
        listEl.innerHTML = '<div class="flex items-center text-green-600 font-bold p-2"><svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>直近2日間に予約は入っていません。</div>';
        return;
      }
      
      const baseDate = new Date(selectedStartDateStr + "T00:00:00");
      const ul = document.createElement('ul');
      ul.className = 'space-y-2';
      
      events.forEach(ev => {
        const startDt = new Date(ev.startIso);
        const endDt = new Date(ev.endIso);
        
        const formatTime = (dt) => {
          const m = String(dt.getMonth() + 1);
          const d = String(dt.getDate());
          const hh = String(dt.getHours()).padStart(2, '0');
          const mm = String(dt.getMinutes()).padStart(2, '0');
          
          if (dt.getDate() !== baseDate.getDate() || dt.getMonth() !== baseDate.getMonth()) {
             return `翌${m}/${d} ${hh}:${mm}`;
          }
          return `${hh}:${mm}`;
        };

        const li = document.createElement('li');
        li.className = 'flex items-center text-gray-700 bg-white p-2 rounded border border-gray-100 shadow-sm';
        li.innerHTML = `<span class="bg-gray-500 text-white text-[10px] font-bold px-2 py-1 rounded mr-3">予約済</span> ${formatTime(startDt)} 〜 ${formatTime(endDt)}`;
        ul.appendChild(li);
      });
      
      listEl.appendChild(ul);
    }

    async function handleSubmitReservation() {
      const parkingNo = document.querySelector('input[name="parking-no"]:checked').value;
      const startTime = document.getElementById('start-time').value;
      const endType = document.getElementById('end-date-type').value; // 'same' or 'next'
      const endTime = document.getElementById('end-time').value;
      const roomNumber = document.getElementById('room-number').value.trim();
      
      if (!roomNumber) {
        showModal("入力エラー", "部屋番号を入力してください。");
        return;
      }
      
      // 終了日の算出
      let endDtObj = new Date(selectedStartDateStr + "T00:00:00");
      if (endType === 'next') {
        endDtObj.setDate(endDtObj.getDate() + 1);
      }
      const y = endDtObj.getFullYear();
      const m = String(endDtObj.getMonth() + 1).padStart(2, '0');
      const d = String(endDtObj.getDate()).padStart(2, '0');
      const endDateStr = `${y}-${m}-${d}`;

      // JavaScript側での妥当性チェック
      const startTimestamp = new Date(`${selectedStartDateStr}T${startTime}:00`).getTime();
      const endTimestamp = new Date(`${endDateStr}T${endTime}:00`).getTime();
      
      if (startTimestamp >= endTimestamp) {
        showModal("入力エラー", "終了時間は開始時間より後に設定してください。");
        return;
      }
      
      const diffHours = (endTimestamp - startTimestamp) / (1000 * 60 * 60);
      if (diffHours > 24) {
        showModal("入力エラー", "1回の予約は最長24時間までです。24時間を超える場合は、複数回に分けてご予約ください。");
        return;
      }
      
      const btn = document.getElementById('btn-submit');
      const originalContent = btn.innerHTML;
      btn.innerHTML = '<div class="animate-spin inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full mr-2"></div>処理中...';
      btn.disabled = true;
      btn.classList.add('opacity-80');
      
      const payload = {
        action: 'createReservation',
        parkingNo: parkingNo,
        startDateStr: selectedStartDateStr,
        startTime: startTime,
        endDateStr: endDateStr,
        endTime: endTime,
        roomNumber: roomNumber,
        userName: currentUser.name
      };
      
      try {
        const res = await fetch(GAS_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'text/plain', 
          },
          body: JSON.stringify(payload)
        });
        
        const json = await res.json();
        
        if (json.status === "error") {
          throw new Error(json.message);
        }
        
        let msgDate = `${selectedStartDateStr} ${startTime}〜${endTime}`;
        if (endType === 'next') {
          msgDate = `${selectedStartDateStr} ${startTime} 〜 翌日${endTime}`;
        }
        
        showModal("予約完了！", `ご予約を承りました。\n\n【日時】\n${msgDate}\n\n管理組合LINEへ通知されました。カレンダーに予定が登録されます。`);
        
        hideStep2();
        document.getElementById('room-number').value = '';
        
      } catch (err) {
        showModal("予約失敗", "申し訳ありません。処理中にエラーが発生しました。\n(直前で他の予約が埋まった可能性があります)\n\n" + err.message);
      } finally {
        btn.innerHTML = originalContent;
        btn.disabled = false;
        btn.classList.remove('opacity-80');
      }
    }

    function showModal(title, message) {
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-message').textContent = message;
      document.getElementById('modal').classList.remove('hidden');
    }
  </script>

</body>
</html>
